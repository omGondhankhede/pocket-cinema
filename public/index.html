<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PocketFlix | Cinema OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none !important; }
    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    html, body { margin: 0; padding: 0; background-color: #050507; color: #f0f2f5; font-family: 'Montserrat', sans-serif; overflow-x: hidden; height: 100%; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    .nav-wrap { position: fixed; top: 0; left: 0; right: 0; height: 72px; z-index: 100; padding: 0 36px; background: linear-gradient(180deg, #050507 0%, rgba(5,5,7,0.92) 75%, transparent 100%); line-height: 72px; }
    .brand { float: left; font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #ffffff; text-decoration: none; }
    .menu-bar { float: left; margin-left: 30px; }
    .menu-item { display: inline-block; font-size: 13px; font-weight: 800; color: #7d8590; padding: 0 10px; margin-right: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .menu-item.active { color: #ffffff; }
    .color-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
    .dot-red { background-color: #E50914; } .dot-green { background-color: #2ecc71; } .dot-yellow { background-color: #f1c40f; } .dot-blue { background-color: #3498db; }
    .nav-actions { float: right; line-height: 72px; }
    .action-btn { display: inline-block; background-color: #16181d; color: #d0d7de; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 800; margin-left: 8px; vertical-align: middle; }
    .room-badge { display: inline-block; background-color: #E50914; color: #ffffff; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 900; letter-spacing: 1.5px; margin-left: 8px; vertical-align: middle; box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4); }
    .search-input { display: inline-block; width: 160px; background-color: #121318; border: 1px solid #30363d; color: #ffffff; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; vertical-align: middle; margin-left: 8px; transition: width 0.2s ease, border-color 0.2s ease; }
    .search-input:focus { width: 220px; border-color: #58a6ff; }
    .hero-banner { position: relative; width: 100%; height: 330px; background-color: #0a0b0e; background-position: center 20%; background-size: cover; background-repeat: no-repeat; padding: 85px 36px 20px 36px; overflow: hidden; }
    .hero-vignette { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(90deg, #050507 0%, rgba(5,5,7,0.88) 42%, rgba(5,5,7,0.2) 100%), linear-gradient(180deg, transparent 50%, #050507 100%); }
    .hero-content { position: relative; z-index: 5; max-width: 680px; padding-top: 15px; }
    .hero-tag { display: inline-block; background-color: #E50914; color: #ffffff; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .hero-title { font-size: 34px; font-weight: 900; color: #ffffff; margin: 0 0 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px #000000; }
    .hero-meta { font-size: 13px; font-weight: 800; color: #ffca28; margin-bottom: 10px; }
    .hero-desc { font-size: 13px; font-weight: 500; color: #b1bac4; line-height: 1.45; height: 56px; overflow: hidden; margin: 0; }
    .catalog-wrap { padding: 10px 26px 50px 26px; }
    .section-bar { padding: 0 10px 14px 10px; overflow: hidden; }
    .section-title { float: left; font-size: 18px; font-weight: 800; margin: 0; color: #ffffff; }
    .remote-hint { float: right; font-size: 11px; font-weight: 700; color: #6e7681; line-height: 22px; }
    .grid { width: 100%; font-size: 0; text-align: left; }
    .card { display: inline-block; vertical-align: top; width: 18%; margin: 0 1% 24px 1%; font-size: 13px; cursor: pointer; opacity: 0.65; transform: translate3d(0, 0, 0); transition: transform 0.18s ease-out, opacity 0.18s ease-out; }
    .poster { position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background-color: #111318; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card.active-card, .card:hover { opacity: 1; transform: translate3d(0, -10px, 0) scale(1.05); z-index: 10; }
    .card.active-card .poster, .card:hover .poster { box-shadow: 0 14px 28px #000000, 0 0 18px rgba(229, 9, 20, 0.45); }
    .card-title { margin-top: 9px; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff; }
    .card-sub { font-size: 11px; color: #7d8590; font-weight: 700; margin-top: 3px; }
    .star-rating { color: #ffca28; }
    .loading-pulse { width: 98%; margin: 0 auto; height: 90px; border-radius: 8px; background-color: #0d0f14; text-align: center; line-height: 90px; color: #7d8590; font-size: 14px; font-weight: 700; }
    #playerModal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 99999; }
    #tvPlayer { width: 100%; height: 100%; }
    #statusToast { display: none; position: fixed; bottom: 26px; right: 26px; background: #E50914; color: #fff; padding: 12px 22px; border-radius: 6px; font-weight: 800; font-size: 13px; z-index: 99999; }
    .assistant-bar { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 600px; background: rgba(18, 19, 24, 0.96); border: 1px solid #30363d; border-radius: 20px; padding: 16px 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(88, 166, 255, 0.25); transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100000; }
    .assistant-bar.active { bottom: 40px; }
    .assistant-icon { font-size: 24px; margin-right: 16px; animation: glowPulse 1.5s infinite; text-shadow: 0 0 10px rgba(88, 166, 255, 0.8); }
    .assistant-text { font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
    @keyframes glowPulse { 0%, 100% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.1); } }
  </style>
</head>
<body>

  <header class="nav-wrap">
    <a class="brand" href="#" onclick="switchCategory('home'); return false;">
      POCKET<span style="color: #E50914;">FLIX</span>
    </a>
    <nav class="menu-bar">
      <button class="menu-item active" id="nav-home" onclick="switchCategory('home')"><span class="color-dot dot-red"></span>Home</button>
      <button class="menu-item" id="nav-movies" onclick="switchCategory('movies')"><span class="color-dot dot-green"></span>Movies</button>
      <button class="menu-item" id="nav-series" onclick="switchCategory('series')"><span class="color-dot dot-yellow"></span>Series</button>
      <button class="menu-item" id="nav-bollywood" onclick="switchCategory('bollywood')"><span class="color-dot dot-blue"></span>Bollywood</button>
    </nav>
    <div class="nav-actions">
      <div class="room-badge" id="roomBadge">CODE: ----</div>
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Movies..." oninput="handleSearchInput(this.value)">
      <button id="mic-btn" onclick="triggerVoiceSearch()" style="background: none; border: none; font-size: 20px; cursor: pointer; margin-left: 10px; vertical-align: middle;" title="Voice Search">🎤</button>
      <button onclick="window.location.reload()" class="action-btn">↻ [9]</button>
    </div>
  </header>

  <section class="hero-banner" id="heroBanner">
    <div class="hero-vignette"></div>
    <div class="hero-content">
      <span class="hero-tag" id="heroTag">SPOTLIGHT</span>
      <h1 class="hero-title" id="heroTitle">Loading PocketFlix...</h1>
      <div class="hero-meta" id="heroMeta">★ -- · ----</div>
      <p class="hero-desc" id="heroDesc">Use [4 / 8 / 6 / 2] on your Sony remote to browse and press [5 / OK] to play.</p>
    </div>
  </section>

  <div class="catalog-wrap">
    <div class="section-bar">
      <h2 class="section-title" id="sectionTitle">🔥 Trending Today</h2>
      <span class="remote-hint">[4/6] Left/Right · [8] Down · [2] Up · [5/OK] Play · [0] AI Mic</span>
    </div>
    <div class="grid" id="homeGrid">
      <div class="loading-pulse">Loading Cinema Catalog...</div>
    </div>
  </div>

  <div id="playerModal">
    <video id="tvPlayer" controls autoplay></video>
  </div>
  <div id="statusToast"></div>

  <div id="assistantBar" class="assistant-bar">
    <div class="assistant-icon">✨</div>
    <div class="assistant-text" id="assistantText">Ready</div>
  </div>

  <script>
    var BACKEND_URL = 'https://pocket-cinema.onrender.com';
    var TMDB_API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
    var GROQ_API_KEY = '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';
    
    var currentItems = [];
    var currentIndex = 0;
    var hlsInstance = null;
    var currentCategory = 'home';
    var searchQuery = '';
    var currentPage = 1;
    var totalPages = 1;
    var isLoadingMore = false;

    // PERSISTENT ROOM CODE
    var roomCode = localStorage.getItem('pocketFlixRoomCode');
    if (!roomCode) {
      roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      localStorage.setItem('pocketFlixRoomCode', roomCode);
    }
    document.getElementById('roomBadge').innerText = 'CODE: ' + roomCode;

    // AUDIO SYSTEM
    var audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playBeep(type) {
      initAudio();
      var osc = audioCtx.createOscillator();
      var gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      if (type === 'start') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // UI ASSISTANT LOGIC
    var assistantHideTimeout = null;
    function showAssistant(text) {
      clearTimeout(assistantHideTimeout);
      document.getElementById('assistantText').innerText = text;
      document.getElementById('assistantBar').classList.add('active');
    }
    function hideAssistant() {
      document.getElementById('assistantBar').classList.remove('active');
    }

    // WEBSOCKET LOGIC
    try {
      var socket = io(BACKEND_URL);
      socket.on('connect', function() {
        socket.emit('join_room', roomCode);
      });
      socket.on('execute_action', function(data) {
        if (data.action === 'voice_query') {
          processVoiceQuery(data.query);
        }
      });
    } catch (e) {
      console.log('Socket disconnected.');
    }

    // AI BRAIN ROUTING
    async function processVoiceQuery(query) {
      var lower = query.toLowerCase().trim();
      
      if (lower.startsWith("search ")) {
        var term = query.substring(7).trim();
        document.getElementById('searchInput').value = term; 
        showAssistant('🔍 Searching Catalog: "' + term + '"');
        handleSearchInput(term);
        assistantHideTimeout = setTimeout(hideAssistant, 3000);
        return;
      }
      
      processWithGroq(query);
    }

    async function processWithGroq(query) {
      showAssistant("✨ Thinking...");
      playBeep('start');
      
      const systemPrompt = `You are the AI brain of PocketFlix. You output strictly in JSON format. 
      If the user wants to play, watch, or start a movie/show, output: {"intent": "play", "title": "the movie name"}
      If the user asks a question, output: {"intent": "chat", "answer": "your short answer"}`;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },
          body: JSON.stringify({
            model: "llama3-8b-8192", 
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: query }
            ],
            response_format: { type: "json_object" },
            temperature: 0.2
          })
        });
        
        const data = await response.json();
        
        if (data.error) {
            showAssistant("AI Error: " + data.error.message);
            assistantHideTimeout = setTimeout(hideAssistant, 6000);
            return;
        }

        if (data.choices && data.choices.length > 0) {
          const aiResponse = data.choices[0].message.content;
          
          try {
              const parsed = JSON.parse(aiResponse);
              
              if (parsed.intent === 'play' && parsed.title) {
                  showAssistant("🎬 Finding: " + parsed.title);
                  fetchTmdbIdAndPlay(parsed.title);
              } else if (parsed.intent === 'chat' && parsed.answer) {
                  showAssistant("🤖 " + parsed.answer);
                  assistantHideTimeout = setTimeout(hideAssistant, 8000);
              } else {
                  showAssistant("🤖 I didn't catch that.");
                  assistantHideTimeout = setTimeout(hideAssistant, 4000);
              }
          } catch (err) {
              showAssistant("🤖 Response Error: Invalid JSON");
              assistantHideTimeout = setTimeout(hideAssistant, 4000);
          }
        } else {
          showAssistant("API returned an empty response.");
          assistantHideTimeout = setTimeout(hideAssistant, 4000);
        }
      } catch(e) {
        showAssistant("AI Connection Error.");
        assistantHideTimeout = setTimeout(hideAssistant, 4000);
      }
    }

    function fetchTmdbIdAndPlay(title) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://api.themoviedb.org/3/search/multi?api_key=' + TMDB_API_KEY + '&query=' + encodeURIComponent(title), true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          var resp = JSON.parse(xhr.responseText);
          var results = (resp.results || []).filter(item => item.media_type !== 'person' && item.poster_path);
          if (results.length > 0) {
            var item = results[0];
            var mediaTitle = item.title || item.name;
            hideAssistant();
            playMovie(item.id, mediaTitle); 
          } else {
            showAssistant("Couldn't find '" + title + "' in TMDB.");
            assistantHideTimeout = setTimeout(hideAssistant, 4000);
          }
        }
      };
      xhr.send();
    }

    // TV MIC DETECTOR
    function triggerVoiceSearch() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            showToast("No TV Mic detected. Use your Phone App.");
            showAssistant("Waiting for Phone Audio...");
            return;
        }
        
        try {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                showAssistant("Listening...");
                playBeep('start');
            };

            recognition.onresult = (event) => {
                const query = event.results[0][0].transcript;
                console.log("Heard locally:", query);
                processVoiceQuery(query); 
            };
            
            recognition.onerror = (event) => {
                if (event.error === 'no-speech' || event.error === 'audio-capture' || event.error === 'not-allowed') {
                    showToast("No TV Mic active. Speak into your Phone App.");
                    showAssistant("Waiting for Phone Audio...");
                } else {
                    showAssistant("Voice check failed: " + event.error);
                    assistantHideTimeout = setTimeout(hideAssistant, 3000);
                }
            };
            
            recognition.start();
        } catch(err) {
            showToast("TV Mic access denied. Use your Phone.");
            showAssistant("Waiting for Phone Audio...");
        }
    }

    // CATALOG NAVIGATION
    function switchCategory(type) {
      currentCategory = type;
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('nav-home').className = 'menu-item' + (type === 'home' ? ' active' : '');
      document.getElementById('nav-movies').className = 'menu-item' + (type === 'movies' ? ' active' : '');
      document.getElementById('nav-series').className = 'menu-item' + (type === 'series' ? ' active' : '');
      document.getElementById('nav-bollywood').className = 'menu-item' + (type === 'bollywood' ? ' active' : '');
      currentPage = 1;
      fetchCatalog(false);
    }

    function handleSearchInput(val) {
      searchQuery = val.trim();
      currentPage = 1;
      fetchCatalog(false);
    }

    function getApiUrl() {
      if (searchQuery.length > 0) {
        document.getElementById('sectionTitle').innerText = '🔍 Search: "' + searchQuery + '"';
        return 'https://api.themoviedb.org/3/search/multi?api_key=' + TMDB_API_KEY + '&query=' + encodeURIComponent(searchQuery) + '&page=' + currentPage;
      }
      var titleEl = document.getElementById('sectionTitle');
      if (currentCategory === 'home') {
        titleEl.innerText = '🔥 Trending Today';
        return 'https://api.themoviedb.org/3/trending/all/day?api_key=' + TMDB_API_KEY + '&page=' + currentPage;
      } else if (currentCategory === 'movies') {
        titleEl.innerText = '🎬 Popular Movies';
        return 'https://api.themoviedb.org/3/movie/popular?api_key=' + TMDB_API_KEY + '&language=en-US&page=' + currentPage;
      } else if (currentCategory === 'series') {
        titleEl.innerText = '📺 Popular TV Series';
        return 'https://api.themoviedb.org/3/tv/popular?api_key=' + TMDB_API_KEY + '&language=en-US&page=' + currentPage;
      } else if (currentCategory === 'bollywood') {
        titleEl.innerText = '🇮🇳 Popular Bollywood';
        return 'https://api.themoviedb.org/3/discover/movie?api_key=' + TMDB_API_KEY + '&with_original_language=hi&sort_by=popularity.desc&page=' + currentPage;
      }
    }

    function fetchCatalog(append) {
      if (isLoadingMore) return;
      isLoadingMore = true;

      var grid = document.getElementById('homeGrid');
      if (!append) {
        grid.innerHTML = '<div class="loading-pulse">Loading Cinema Catalog...</div>';
        currentItems = [];
        currentIndex = 0;
      }

      var xhr = new XMLHttpRequest();
      xhr.open('GET', getApiUrl(), true);
      xhr.onload = function() {
        isLoadingMore = false;
        if (xhr.status === 200) {
          var resp = JSON.parse(xhr.responseText);
          var results = resp.results || [];
          totalPages = resp.total_pages || 1;
          renderGrid(results, append);
        }
      };
      xhr.onerror = function() {
        isLoadingMore = false;
      };
      xhr.send();
    }

    function renderGrid(items, append) {
      var grid = document.getElementById('homeGrid');
      if (!append) grid.innerHTML = '';

      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        if (!item.poster_path) continue;
        if (item.media_type === 'person') continue;

        currentItems.push(item);
        var cardIndex = currentItems.length - 1;

        var title = item.title || item.name || 'Untitled';
        var dateStr = (item.release_date || item.first_air_date || 'N/A').split('-')[0];
        var rating = item.vote_average ? item.vote_average.toFixed(1) : 'NR';

        var card = document.createElement('article');
        card.className = 'card' + ((!append && cardIndex === 0) ? ' active-card' : '');
        card.id = 'card-' + cardIndex;
        card.innerHTML = '<div class="poster"><img src="https://image.tmdb.org/t/p/w342' + item.poster_path + '"></div>' +
                         '<div class="card-title">' + title + '</div>' +
                         '<div class="card-sub">' + dateStr + ' · <span class="star-rating">★</span> ' + rating + '</div>';

        card.onclick = (function(idx) {
          return function() {
            highlightCard(idx);
            selectCurrentCard();
          };
        })(cardIndex);

        grid.appendChild(card);
      }

      if (!append && currentItems.length > 0) {
        updateHeroSpotlight(currentItems[0]);
      }
    }

    // INFINITE SCROLL
    window.addEventListener('scroll', function() {
      var scrollPos = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      var viewHeight = window.innerHeight || document.documentElement.clientHeight || 720;
      var docHeight = document.body.offsetHeight || document.documentElement.scrollHeight || 0;
      
      if ((viewHeight + scrollPos) >= docHeight - 500) {
        if (!isLoadingMore && currentPage < totalPages) {
          currentPage++;
          fetchCatalog(true);
        }
      }
    });

    function updateHeroSpotlight(item) {
      if (!item) return;
      var title = item.title || item.name || 'Untitled';
      var dateStr = (item.release_date || item.first_air_date || 'N/A').split('-')[0];
      var rating = item.vote_average ? item.vote_average.toFixed(1) : 'NR';
      var isSeries = (item.first_air_date && !item.release_date);

      document.getElementById('heroTag').innerText = isSeries ? 'TV SERIES' : 'FEATURE FILM';
      document.getElementById('heroTitle').innerText = title;
      document.getElementById('heroMeta').innerText = '★ ' + rating + ' TMDB  ·  ' + dateStr +  '  ·  Press [5/OK] to Play';
      document.getElementById('heroDesc').innerText = item.overview || 'No description available.';

      var bgPath = item.backdrop_path || item.poster_path;
      if (bgPath) {
        document.getElementById('heroBanner').style.backgroundImage = 'url(https://image.tmdb.org/t/p/w780' + bgPath + ')';
      }
    }

    function highlightCard(newIndex) {
      if (currentItems.length === 0) return;
      if (newIndex < 0) newIndex = 0;
      if (newIndex >= currentItems.length) newIndex = currentItems.length - 1;

      var oldCard = document.getElementById('card-' + currentIndex);
      if (oldCard) oldCard.className = 'card';

      currentIndex = newIndex;
      var newCard = document.getElementById('card-' + currentIndex);
      if (newCard) {
        newCard.className = 'card active-card';
        updateHeroSpotlight(currentItems[currentIndex]);

        var absoluteTop = 0;
        var el = newCard;
        while (el) {
          absoluteTop += el.offsetTop;
          el = el.offsetParent;
        }

        var scrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        var viewHeight = window.innerHeight || document.documentElement.clientHeight || 720;
        
        if (absoluteTop < 450) {
          window.scrollTo(0, 0);
        } else if (absoluteTop > scrollY + viewHeight - 200 || absoluteTop < scrollY + 80) {
          window.scrollTo(0, absoluteTop - (viewHeight / 2) + 150);
        }
      }
    }

    function showToast(msg) {
      var t = document.getElementById("statusToast");
      if (t) {
        t.innerText = msg;
        t.style.display = "block";
        setTimeout(function() { t.style.display = "none"; }, 4000);
      }
    }

    function selectCurrentCard() {
      var item = currentItems[currentIndex];
      if (!item) return;
      var title = item.title || item.name || 'Movie';
      playMovie(item.id, title);
    }

    // RESOLVE & STREAM
    function playMovie(tmdbId, title) {
      showToast('⚡ Sniffing stream for "' + title + '"...');

      var xhr = new XMLHttpRequest();
      xhr.open('GET', BACKEND_URL + '/resolve?tmdb=' + tmdbId, true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.status === 'ok' && data.streamUrl) {
              showToast('▶ Playing "' + title + '"');
              var finalUrl = data.streamUrl.startsWith('http') ? data.streamUrl : (BACKEND_URL + data.streamUrl);
              startVideo(finalUrl);
            } else {
              showToast('❌ Could not resolve stream link.');
            }
          } catch(e) {
            showToast('❌ Error parsing server response.');
          }
        } else {
          showToast('❌ Server error.');
        }
      };
      xhr.onerror = function() {
        showToast('❌ Server connection failed.');
      };
      xhr.send();
    }

    function startVideo(url) {
      var modal = document.getElementById("playerModal");
      var video = document.getElementById("tvPlayer");
      if (modal) modal.style.display = "block";

      if (window.Hls && Hls.isSupported() && url.indexOf(".m3u8") !== -1) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() { 
          if (video) video.play(); 
        });
      } else {
        if (video) {
          video.src = url;
          video.play();
        }
      }
    }

    // REMOTE CONTROLLER EVENT HANDLER
    window.addEventListener('keydown', function(e) {
      initAudio();
      var modal = document.getElementById("playerModal");
      var code = e.keyCode || e.which;
      var key = e.key || '';

      if (modal && modal.style.display === "block") {
        if (code === 27 || code === 10009 || code === 8 || key === 'Escape') {
          e.preventDefault();
          var video = document.getElementById("tvPlayer");
          if (video) {
            video.pause();
            video.src = "";
          }
          if (hlsInstance) hlsInstance.destroy();
          modal.style.display = "none";
        }
        return;
      }

      if (document.activeElement === document.getElementById('searchInput')) {
        return;
      }

      if (code === 48 || code === 96 || key === '0') {
        e.preventDefault();
        triggerVoiceSearch();
        return;
      }

      if (code === 403 || key === 'ColorF0Red' || key === 'Red' || code === 82) {
        e.preventDefault();
        switchCategory('home');
        return;
      }
      if (code === 404 || key === 'ColorF1Green' || key === 'Green' || code === 71) {
        e.preventDefault();
        switchCategory('movies');
        return;
      }
      if (code === 405 || key === 'ColorF2Yellow' || key === 'Yellow' || code === 89) {
        e.preventDefault();
        switchCategory('series');
        return;
      }
      if (code === 406 || key === 'ColorF3Blue' || key === 'Blue' || code === 66) {
        e.preventDefault();
        switchCategory('bollywood');
        return;
      }

      if (code === 57 || code === 105 || key === '9' || code === 116) {
        e.preventDefault();
        window.location.reload();
        return;
      }

      var cols = 5;
      if (code === 52 || code === 100 || key === '4') {
        e.preventDefault();
        highlightCard(currentIndex - 1);
      } else if (code === 54 || code === 102 || key === '6') {
        e.preventDefault();
        highlightCard(currentIndex + 1);
      } else if (code === 56 || code === 104 || key === '8') {
        e.preventDefault();
        highlightCard(currentIndex + cols);
      } else if (code === 50 || code === 98 || key === '2') {
        e.preventDefault();
        highlightCard(currentIndex - cols);
      } else if (code === 53 || code === 101 || key === '5' || code === 13) {
        e.preventDefault();
        selectCurrentCard();
      }
    });

    fetchCatalog(false);
  </script>
</body>
</html>
